name: Compact listening rank preview

on:
  push:
    branches:
      - codex/ipad-ui-preview

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: a5e8a5f4acd989b1934bdc9d6307ed12fb9aa546
          path: source
          persist-credentials: false

      - name: Compile ranking views with preview data
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -version
          APP="$RUNNER_TEMP/MeloXRankPreview.app"
          mkdir -p "$APP"
          cp -R source/MeloXLocalization/{en,zh-Hans}.lproj "$APP/"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -sdk "$SDK" -target "$(uname -m)-apple-ios26.0-simulator" \
            -swift-version 5 -default-isolation MainActor -parse-as-library -module-name MeloXRankPreview \
            Tools/Preview/CompactRankPreview.swift \
            source/MeloX/Core/Models/Account/UserPlayRecordModels.swift \
            source/MeloX/Shared/Components/FilterPicker.swift \
            source/MeloX/Shared/Media/TrackRowView.swift \
            source/MeloX/Features/Account/UserListeningRankView.swift \
            -o "$APP/MeloXRankPreview"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          orientations = ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
          with open(sys.argv[1], "wb") as handle:
              plistlib.dump(dict(
                  CFBundleDevelopmentRegion="zh-Hans",
                  CFBundleDisplayName="MeloX Rank Preview",
                  CFBundleExecutable="MeloXRankPreview",
                  CFBundleIdentifier="com.melox.rank.preview",
                  CFBundleName="MeloXRankPreview",
                  CFBundlePackageType="APPL",
                  CFBundleSupportedPlatforms=["iPhoneSimulator"],
                  CFBundleShortVersionString="1.0",
                  CFBundleVersion="1",
                  MinimumOSVersion="26.0",
                  UIDeviceFamily=[1, 2],
                  UIApplicationSceneManifest={"UIApplicationSupportsMultipleScenes": False},
                  UILaunchScreen={},
                  UISupportedInterfaceOrientations=orientations,
                  **{"UISupportedInterfaceOrientations~ipad": orientations},
              ), handle)
          PY
          codesign --force --sign - "$APP"

      - name: Capture iPad layout
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p preview
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          DEVICE="$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, re, sys
          runtimes = json.load(open(sys.argv[1]))["devices"]
          candidates = sorted(
              (key for key in runtimes if re.search(r"\.iOS-26-\d+(?:-\d+)?$", key)),
              key=lambda key: (not key.endswith(".iOS-26-4"), key),
          )
          for runtime in candidates:
              devices = [device for device in runtimes[runtime] if device["isAvailable"] and device["name"].startswith("iPad")]
              devices.sort(key=lambda device: (device["state"] != "Booted", "11-inch" not in device["name"], "Pro" not in device["name"]))
              if devices:
                  print(devices[0]["udid"])
                  break
          else:
              raise SystemExit("No preconfigured iPad simulator with iPadOS 26")
          PY
          )"
          limited() {
            perl -e 'alarm shift @ARGV; exec @ARGV or die $!;' "$@"
          }
          limited 200 xcrun simctl bootstatus "$DEVICE" -b
          limited 85 xcrun simctl install "$DEVICE" "$RUNNER_TEMP/MeloXRankPreview.app"
          limited 40 xcrun simctl launch "$DEVICE" com.melox.rank.preview -AppleLanguages '(zh-Hans)'
          sleep 5
          limited 30 xcrun simctl io "$DEVICE" screenshot preview/MeloX-iPad-Rank.png
          sips -g pixelWidth -g pixelHeight preview/MeloX-iPad-Rank.png
          limited 40 xcrun simctl launch --terminate-running-process "$DEVICE" com.melox.rank.preview --compact --large-text -AppleLanguages '(zh-Hans)'
          sleep 4
          limited 30 xcrun simctl io "$DEVICE" screenshot preview/MeloX-iPad-Rank-Large-Text.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MeloX-Compact-Rank-Preview
          path: preview/*.png
          if-no-files-found: error
          retention-days: 14
