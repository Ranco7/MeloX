name: Unsigned iOS IPA / 未签名 iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/hide-volume-airplay-fix-2e4e1e1

permissions:
  contents: read

concurrency:
  group: unsigned-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned iOS IPA / 构建未签名 iOS IPA
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27.1 / 选择 Xcode 27.1
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=""
          for candidate in /Applications/Xcode_27.1.app /Applications/Xcode_27.1.0.app /Applications/Xcode.app; do
            if [[ -d "${candidate}" ]]; then
              XCODE_APP="${candidate}"
              break
            fi
          done
          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::Xcode 27.1 was not found on the xcode-27 runner"
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK ${SDK_VERSION}"
          IFS=. read -r SDK_MAJOR SDK_MINOR _ <<< "${SDK_VERSION}"
          if (( SDK_MAJOR < 27 || (SDK_MAJOR == 27 && ${SDK_MINOR:-0} < 1) )); then
            echo "::error::iOS 27.1 SDK or later is required; found ${SDK_VERSION}"
            exit 1
          fi

      - name: Run playback regression
        shell: bash
        run: python3 Tools/Tests/test_playback_song_switch.py

      - name: Run iPad sidebar startup regression
        shell: bash
        run: python3 Tools/Tests/test_sidebar_playlists.py

      - name: Run artwork background color regression
        shell: bash
        run: |
          swiftc MeloX/Core/Artwork/ArtworkBackgroundColor.swift \
            Tests/Artwork/ArtworkBackgroundColorChecks.swift \
            -o "$RUNNER_TEMP/artwork-background-checks"
          "$RUNNER_TEMP/artwork-background-checks"

      - name: Run broadcast capture regression / 检查系统音频采集
        shell: bash
        run: python3 -m unittest Tools.Tests.test_broadcast_capture -v

      - name: Build unsigned IPA / 构建未签名 IPA
        shell: bash
        run: bash build_ios_unsigned.sh

      - name: Inspect unsigned IPA / 检查未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="build/MeloX-iOS-unsigned.ipa"
          APP="build/IPA/Payload/MeloX.app"
          test -d "${APP}"
          test -f "${IPA}"
          unzip -tq "${IPA}"
          python3 Tools/verify_broadcast_bundle.py "${APP}" --ipa "${IPA}"

          echo "size: $(du -h "${IPA}" | awk '{print $1}')"
          echo "bytes: $(wc -c < "${IPA}" | tr -d ' ')"
          shasum -a 256 "${IPA}"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist")"
          python3 -c 'import plistlib, sys; assert 2 in plistlib.load(open(sys.argv[1], "rb"))["UIDeviceFamily"], "IPA must support iPad"' "${APP}/Info.plist"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist")"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Info.plist")"
          echo "CFBundleIdentifier: ${BUNDLE_ID}"
          echo "CFBundleShortVersionString: ${SHORT_VERSION}"
          echo "CFBundleVersion: ${BUILD_VERSION}"

          echo "Frameworks:"
          find "${APP}/Frameworks" -maxdepth 1 -mindepth 1 -print 2>/dev/null || echo "(none)"
          echo "PlugIns:"
          find "${APP}/PlugIns" -maxdepth 1 -mindepth 1 -print 2>/dev/null || echo "(none)"
          echo "Watch:"
          find "${APP}/Watch" -maxdepth 2 -name '*.app' -print 2>/dev/null || echo "(none)"

          if find "${APP}" -name 'embedded.mobileprovision' -print | grep -q .; then
            echo "::error::embedded.mobileprovision was found"
            exit 1
          fi
          echo "embedded.mobileprovision: absent"

          set +e
          SIGN_INFO="$(codesign -dv --verbose=4 "${APP}" 2>&1)"
          set -e
          echo "${SIGN_INFO}"
          if [[ "${SIGN_INFO}" != *"code object is not signed at all"* ]]; then
            echo "::error::App is signed; refusing to publish"
            exit 1
          fi

      - name: Replace only the requested release attachment
        if: github.repository == 'Ranco7/MeloX' && github.ref == 'refs/heads/codex/hide-volume-airplay-fix-2e4e1e1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=fix-2e4e1e1
          ASSET=MeloX-2.0-unsigned-2e4e1e1.ipa
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release-before.json"
          python3 - "$RUNNER_TEMP/release-before.json" <<'PYVERIFY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r['id'] == 441011829 and r['tag_name'] == 'fix-2e4e1e1'
          assert [a['name'] for a in r['assets']] == ['MeloX-2.0-unsigned-2e4e1e1.ipa']
          PYVERIFY
          cp build/MeloX-iOS-unsigned.ipa "$RUNNER_TEMP/$ASSET"
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release-after.json"
          python3 - "$RUNNER_TEMP/release-before.json" "$RUNNER_TEMP/release-after.json" "$RUNNER_TEMP/$ASSET" <<'PYVERIFY'
          import hashlib, json, sys
          before, after = [json.load(open(p)) for p in sys.argv[1:3]]
          for key in ('id', 'tag_name', 'target_commitish', 'name', 'body', 'draft', 'prerelease'):
              assert before[key] == after[key], key
          assert [a['name'] for a in after['assets']] == ['MeloX-2.0-unsigned-2e4e1e1.ipa']
          asset = after['assets'][0]
          digest = hashlib.sha256(open(sys.argv[3], 'rb').read()).hexdigest()
          assert asset['state'] == 'uploaded'
          assert asset['digest'] == 'sha256:' + digest
          print('Verified attachment replacement:', asset['browser_download_url'], digest)
          PYVERIFY
