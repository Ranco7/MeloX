name: Unsigned iOS IPA / 未签名 iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/listen-together-sync-9
      - codex/ipad-adaptive-layout

permissions:
  contents: read

concurrency:
  group: unsigned-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned iOS IPA / 构建未签名 iOS IPA
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27.1 / 选择 Xcode 27.1
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=""
          for candidate in /Applications/Xcode_27.1.app /Applications/Xcode_27.1.0.app /Applications/Xcode.app; do
            if [[ -d "${candidate}" ]]; then
              XCODE_APP="${candidate}"
              break
            fi
          done
          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::Xcode 27.1 was not found on the xcode-27 runner"
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK ${SDK_VERSION}"
          IFS=. read -r SDK_MAJOR SDK_MINOR _ <<< "${SDK_VERSION}"
          if (( SDK_MAJOR < 27 || (SDK_MAJOR == 27 && ${SDK_MINOR:-0} < 1) )); then
            echo "::error::iOS 27.1 SDK or later is required; found ${SDK_VERSION}"
            exit 1
          fi

      - name: Run playback regression
        shell: bash
        run: python3 Tools/Tests/test_playback_song_switch.py

      - name: Build unsigned IPA / 构建未签名 IPA
        shell: bash
        run: bash build_ios_unsigned.sh

      - name: Inspect unsigned IPA / 检查未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="build/MeloX-iOS-unsigned.ipa"
          APP="build/IPA/Payload/MeloX.app"
          test -d "${APP}"
          test -f "${IPA}"
          unzip -tq "${IPA}"

          echo "size: $(du -h "${IPA}" | awk '{print $1}')"
          echo "bytes: $(wc -c < "${IPA}" | tr -d ' ')"
          shasum -a 256 "${IPA}"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist")"
          python3 -c 'import plistlib, sys; assert 2 in plistlib.load(open(sys.argv[1], "rb"))["UIDeviceFamily"], "IPA must support iPad"' "${APP}/Info.plist"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist")"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Info.plist")"
          echo "CFBundleIdentifier: ${BUNDLE_ID}"
          echo "CFBundleShortVersionString: ${SHORT_VERSION}"
          echo "CFBundleVersion: ${BUILD_VERSION}"

          echo "Frameworks:"
          find "${APP}/Frameworks" -maxdepth 1 -mindepth 1 -print 2>/dev/null || echo "(none)"
          echo "PlugIns:"
          find "${APP}/PlugIns" -maxdepth 1 -mindepth 1 -print 2>/dev/null || echo "(none)"
          echo "Watch:"
          find "${APP}/Watch" -maxdepth 2 -name '*.app' -print 2>/dev/null || echo "(none)"

          if find "${APP}" -name 'embedded.mobileprovision' -print | grep -q .; then
            echo "::error::embedded.mobileprovision was found"
            exit 1
          fi
          echo "embedded.mobileprovision: absent"

          set +e
          SIGN_INFO="$(codesign -dv --verbose=4 "${APP}" 2>&1)"
          set -e
          echo "${SIGN_INFO}"
          if [[ "${SIGN_INFO}" != *"code object is not signed at all"* ]]; then
            echo "::error::App is signed; refusing to publish"
            exit 1
          fi

      - name: Upload IPA artifact / 上传 IPA
        if: github.ref != 'refs/heads/codex/ipad-adaptive-layout'
        uses: actions/upload-artifact@v7
        with:
          name: MeloX-iOS-unsigned
          path: build/MeloX-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified IPA / 发布已校验的 IPA
        if: github.repository == 'Ranco7/MeloX' && github.ref == 'refs/heads/codex/ipad-adaptive-layout'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA=build/MeloX-iOS-unsigned.ipa
          TAG="unsigned-ipad-layout-${GITHUB_SHA:0:7}"
          SHA256="$(shasum -a 256 "$IPA" | cut -d ' ' -f 1)"
          cat > "$RUNNER_TEMP/release.md" <<EOF
          iPad 宽窗口采用系统侧栏，首页快捷入口、搜索分类和收藏专辑按宽度调整排版，歌单和专辑详情可并排显示封面与曲目。

          此 IPA 未签名，安装前需要自行签名。包含 iOS 主应用、歌词组件和 Apple Watch 应用。

          - 构建提交：\`${GITHUB_SHA}\`
          - [构建记录](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - SHA-256：\`${SHA256}\`
          EOF
          gh release create "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'MeloX iPad 自适应布局 · 未签名 IPA' \
            --notes-file "$RUNNER_TEMP/release.md"
