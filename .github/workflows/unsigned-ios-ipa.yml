name: Align release source archives
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for verified IPA replacement and align source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Ranco7/MeloX
        shell: bash
        run: |
          set -euo pipefail
          gh run watch 42920933299 --repo "$GH_REPO" --exit-status --interval 30
          BUILD_SHA="$(gh api repos/$GH_REPO/actions/runs/42920933299 --jq .head_sha)"
          test "$BUILD_SHA" = ba0f98e5606d4abe769d670fb95c9bafc73b8b7e
          CURRENT="$(gh api repos/$GH_REPO/git/ref/tags/fix-2e4e1e1 --jq .object.sha)"
          if [[ "$CURRENT" != 2e4e1e1448f8aad5e8d3096e4d628b6259ce9bfa && "$CURRENT" != "$BUILD_SHA" ]]; then
            echo "Unexpected tag target; refusing to overwrite it"
            exit 1
          fi
          gh api --method PATCH repos/$GH_REPO/git/refs/tags/fix-2e4e1e1 -f sha="$BUILD_SHA" -F force=false
          AFTER="$(gh api repos/$GH_REPO/git/ref/tags/fix-2e4e1e1 --jq .object.sha)"
          test "$AFTER" = "$BUILD_SHA"
          echo "Verified source archives now match the compiled IPA commit: $BUILD_SHA"
